<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1700" viewBox="0 0 3200 1700" fill="none">

<defs>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFB36A"/>
    <stop offset="0.45" stop-color="#FF6A00"/>
    <stop offset="1" stop-color="#E85D00"/>
  </linearGradient>
  <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111827"/>
    <stop offset="1" stop-color="#030712"/>
  </linearGradient>
  <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.88"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B1220" flood-opacity="0.16"/>
  </filter>
  <filter id="orangeShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#FF6A00" flood-opacity="0.30"/>
  </filter>
</defs>
<rect width="3200" height="1700" fill="#fff"/><text x="1600" y="150" text-anchor="middle" font-family="Inter, Arial" font-size="88" font-weight="900" fill="#111827">2 kostenlose Designvorschläge. 100 % unverbindlich.</text><g transform="translate(240,300)" filter="url(#softShadow)"><rect x="0" y="0" width="1280" height="760" rx="40" fill="#fff" stroke="#E5E7EB"/><rect x="0" y="0" width="1280" height="98" rx="40" fill="#F8FAFC"/><circle cx="60" cy="49" r="14" fill="#EF4444"/><circle cx="105" cy="49" r="14" fill="#F59E0B"/><circle cx="150" cy="49" r="14" fill="#10B981"/><rect x="60" y="155" width="1160" height="310" rx="30" fill="#0B1220"/><rect x="60" y="155" width="1160" height="310" rx="30" fill="url(#orangeGrad)" opacity="0.18"/><text x="110" y="285" font-family="Inter, Arial" font-size="58" font-weight="900" fill="#fff">Qualität, die</text><text x="110" y="355" font-family="Inter, Arial" font-size="58" font-weight="900" fill="#fff">Vertrauen schafft.</text><rect x="110" y="395" width="220" height="56" rx="14" fill="#FF6A00"/><rect x="60" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="465" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="870" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="440" y="-55" width="400" height="84" rx="22" fill="#2563EB"/><text x="640" y="-1" text-anchor="middle" font-family="Inter, Arial" font-size="38" font-weight="900" fill="#fff">Designvorschlag A</text></g><g transform="translate(1630,300)" filter="url(#softShadow)"><rect x="0" y="0" width="1280" height="760" rx="40" fill="#fff" stroke="#E5E7EB"/><rect x="0" y="0" width="1280" height="98" rx="40" fill="#F8FAFC"/><circle cx="60" cy="49" r="14" fill="#EF4444"/><circle cx="105" cy="49" r="14" fill="#F59E0B"/><circle cx="150" cy="49" r="14" fill="#10B981"/><rect x="60" y="155" width="1160" height="310" rx="30" fill="#0B1220"/><rect x="60" y="155" width="1160" height="310" rx="30" fill="url(#orangeGrad)" opacity="0.18"/><text x="110" y="285" font-family="Inter, Arial" font-size="58" font-weight="900" fill="#fff">Qualität, die</text><text x="110" y="355" font-family="Inter, Arial" font-size="58" font-weight="900" fill="#fff">Vertrauen schafft.</text><rect x="110" y="395" width="220" height="56" rx="14" fill="#FF6A00"/><rect x="60" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="465" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="870" y="510" width="350" height="150" rx="24" fill="#F8FAFC"/><rect x="440" y="-55" width="400" height="84" rx="22" fill="#059669"/><text x="640" y="-1" text-anchor="middle" font-family="Inter, Arial" font-size="38" font-weight="900" fill="#fff">Designvorschlag B</text></g><rect x="690" y="1190" width="1820" height="250" rx="38" fill="#FFF7ED" stroke="#FF6A00" stroke-width="4"/><text x="760" y="1280.0" fill="#111827" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="800" text-anchor="start" opacity="1" >Sie erhalten von uns zwei individuelle Designvorschläge. Danach entscheiden Sie</text>
<text x="760" y="1344.8" fill="#111827" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="800" text-anchor="start" opacity="1" >ganz in Ruhe, ob Sie weitermachen möchten. Es gibt keinen automatischen Auftrag –</text>
<text x="760" y="1409.6" fill="#111827" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="800" text-anchor="start" opacity="1" >kein Risiko, kein Druck und kein Kleingedrucktes.</text>
</svg>
