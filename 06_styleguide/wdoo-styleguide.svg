<text x="180" y="2110" font-family="Inter, Arial" font-size="34" font-weight="700" fill="#FFB36A">Psychologischer Hebel: Der Interessent kauft nicht sofort eine Website, sondern fordert erst risikofrei zwei Entwürfe an.</text></svg>
